name: Remove analytics popup
on:
  push:
    branches: [update/remove-analytics-popup]
    paths: [.github/workflows/remove-analytics-popup.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/remove-analytics-popup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Remove popup and update privacy text without changing blog bodies
        run: |
          python scripts/remove_analytics.py
          python scripts/validate.py
          python scripts/stage.py
          python -c "import json; x=json.load(open('blog-preservation.json')); assert x['unique_posts'] >= 101; assert all(p['body_unchanged'] for p in x['checks'])"
      - name: Commit validated pages and runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' site.js scripts/redesign.py
          git commit -m 'Remove analytics popup, settings controls and tracking loader from all pages'
          git push origin HEAD:update/remove-analytics-popup
