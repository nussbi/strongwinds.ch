name: Update facturio screenshot
on:
  push:
    branches: [update/facturio-project-screenshot]
    paths: [.github/workflows/update-facturio-screenshot.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/facturio-project-screenshot
      - name: Import verified current homepage screenshot
        run: |
          curl --fail --location --retry 3 'https://6cc9e075.strongwinds-landing.pages.dev/assets/projects/facturio.jpg' -o assets/projects/facturio.jpg
          echo '167c36c50d65f97d88fd2763628fb9cc6864c37b21a030e0b14334ca334da7d0  assets/projects/facturio.jpg' | sha256sum --check
      - name: Commit image update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects/facturio.jpg
          git commit -m 'Update Projects with current facturio.ch homepage screenshot'
          git push origin HEAD:update/facturio-project-screenshot
